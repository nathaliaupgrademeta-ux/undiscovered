
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undiscovered</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: #eeeeee;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
}

.container {
  width: 100%;
  max-width: 460px;
  text-align: center;
  padding: 28px 22px;
  background: #080808;
}

h1 {
  font-size: 27px;
  font-weight: normal;
  letter-spacing: 3px;
  margin: 10px 0 25px;
  color: #eeeeee;
}

img {
  display: block;
  width: 100%;
  max-height: 290px;
  object-fit: cover;
  margin: 0 auto 22px;
}

.clue {
  color: #cccccc;
  font-size: 15px;
  line-height: 1.7;
  margin: 20px 0;
}

.secret {
  color: #b7a77b;
  font-size: 22px;
  letter-spacing: 5px;
  margin: 22px 0;
}

input {
  width: 100%;
  padding: 15px;
  background: #151515;
  border: 1px solid #777777;
  color: white;
  text-align: center;
  font-size: 16px;
  letter-spacing: 3px;
  outline: none;
  margin-bottom: 14px;
}

input:focus {
  border-color: #b7a77b;
}

button {
  width: 100%;
  padding: 15px;
  background: #b7a77b;
  color: #111111;
  border: none;
  font-weight: bold;
  letter-spacing: 3px;
  cursor: pointer;
}

button:hover {
  background: #d0c094;
}

.error {
  color: #e18a80;
  font: 13px monospace;
  min-height: 20px;
  margin-top: 14px;
}

/* Tela inicial */

#intro {
  position: fixed;
  inset: 0;
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#intro button {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 1px solid #b7a77b;
  background: transparent;
  color: #b7a77b;
  font-size: 30px;
  letter-spacing: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#intro button:hover {
  background: #b7a77b;
  color: black;
}

#app {
  display: none;
}

/* Efeito glitch */
.falha {
  animation: glitch 0.9s steps(2, end);
}

.falha::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    transparent 0px,
    rgba(255,255,255,0.12) 2px,
    transparent 4px
  );
  pointer-events: none;
  animation: glitch-linhas 0.9s steps(2, end);
}

@keyframes glitch {
  0% { transform: translateX(0); }
  15% { transform: translateX(-8px); filter: invert(1); }
  30% { transform: translateX(8px); }
  45% { transform: translateX(-5px); filter: invert(1); }
  60% { transform: translateX(5px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

@keyframes glitch-linhas {
  0%, 100% { opacity: 0; }
  20%, 60% { opacity: 1; }
}

@media (max-width: 380px) {
  .container {
    padding: 22px 16px;
  }

  h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<audio id="music" src="musica.mp3" preload="auto" loop></audio>

<div id="intro">
  <button type="button" onclick="startExperience()">●</button>
</div>

<main class="container" id="app">

  <h1>A SENHA</h1>

  <img src="mercado.jpg" alt="Primeira pista">

  <p class="clue">
    Ele se move usando a terceira lei de Newton, que afirma que para toda ação há uma reação igual e oposta.
  </p>

  <div class="secret">8766</div>

  <div class="secret">ουρανός</div>

  <form onsubmit="checkAnswer(event)">
    <input
      id="answer"
      type="text"
      placeholder="DIGITE A SENHA"
      autocomplete="off"
      required
    >

    <button type="submit">DESBLOQUEAR</button>
  </form>

  <div class="error" id="error"></div>

</main>

<script>

let stage = 1;

function startExperience() {
  const music = document.getElementById("music");

  music.play().catch(() => {
    alert("Não foi possível iniciar a música. Tente tocar novamente.");
  });

  document.getElementById("intro").style.display = "none";

  document.body.classList.add("glitch");

  setTimeout(() => {
    document.getElementById("app").style.display = "block";
    document.body.classList.remove("glitch");
  }, 900);
}

function checkAnswer(event) {
  event.preventDefault();

  const answer = document
    .getElementById("answer")
    .value
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

  if (stage === 1 && answer === "HUBBLE") {
    stage = 2;
    showSecond();
    return;
  }

  if (stage === 2 && answer === "RYU RESTAURANTE") {
    window.location.href =
      "https://open.spotify.com/playlist/272y43cH5m7wrM2HaSV200";
    return;
  }

  document.getElementById("error").textContent =
    "SENHA INCORRETA. TENTE NOVAMENTE.";
}

function showSecond() {
  document.getElementById("app").innerHTML = `

    <h1>A SEGUNDA SENHA</h1>

    <img src="tulla.jpg" alt="Segunda pista">

    <p class="clue">📍 Shibuya</p>

    <form onsubmit="checkAnswer(event)">
      <input
        id="answer"
        type="text"
        placeholder="DIGITE A SENHA"
        autocomplete="off"
        required
      >

      <button type="submit">DESBLOQUEAR</button>
    </form>

    <div class="error" id="error"></div>

  `;
}

</script>

</body>
</html>
