
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undiscovered</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #ffffff;
  color: #252525;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
}

.container {
  width: 100%;
  max-width: 460px;
  text-align: center;
  border: 1px solid #e5e1d8;
  padding: 28px 22px;
  background: #ffffff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

h1 {
  font-size: 27px;
  font-weight: normal;
  letter-spacing: 3px;
  margin: 10px 0 25px;
  color: #252525;
}

img {
  display: block;
  width: 100%;
  max-height: 290px;
  object-fit: cover;
  margin: 0 auto 22px;
  border: 1px solid #e5e1d8;
}

.clue {
  color: #555555;
  font-size: 15px;
  line-height: 1.7;
  margin: 20px 0;
}

.secret {
  color: #9b8960;
  font-size: 22px;
  letter-spacing: 5px;
  margin: 22px 0;
}

input {
  width: 100%;
  padding: 15px;
  background: #ffffff;
  border: 1px solid #c9c3b8;
  color: #252525;
  text-align: center;
  font-size: 16px;
  letter-spacing: 3px;
  outline: none;
  margin-bottom: 14px;
}

input:focus {
  border-color: #9b8960;
}

button {
  width: 100%;
  padding: 15px;
  background: #b7a77b;
  color: #ffffff;
  border: none;
  font-weight: bold;
  letter-spacing: 3px;
  cursor: pointer;
}

button:hover {
  background: #9b8960;
}

.error {
  color: #b34b43;
  font: 13px monospace;
  min-height: 20px;
  margin-top: 14px;
}

@media (max-width: 380px) {
  .container {
    padding: 22px 16px;
  }

  h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<main class="container" id="app">

  <h1>A SENHA</h1>

  <img src="mercado.jpg" alt="Primeira pista">

  <p class="clue">
    Ele se move usando a terceira lei de Newton, que afirma que para toda ação há uma reação igual e oposta.
  </p>

  <div class="secret">8766</div>

  <div class="secret">ουρανός</div>

  <form onsubmit="checkAnswer(event)">
    <input
      id="answer"
      type="text"
      placeholder="DIGITE A SENHA"
      autocomplete="off"
      required
    >

    <button type="submit">DESBLOQUEAR</button>
  </form>

  <div class="error" id="error"></div>

</main>

<script>

let stage = 1;

function checkAnswer(event) {
  event.preventDefault();

  const answer = document
    .getElementById("answer")
    .value
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

  if (stage === 1 && answer === "HUBBLE") {
    stage = 2;
    showSecond();
    return;
  }

  if (stage === 2 && answer === "RYU RESTAURANTE") {
    window.location.href =
      "https://open.spotify.com/playlist/272y43cH5m7wrM2HaSV200";
    return;
  }

  document.getElementById("error").textContent =
    "SENHA INCORRETA. TENTE NOVAMENTE.";
}

function showSecond() {

  document.getElementById("app").innerHTML = `

    <h1>A SEGUNDA SENHA</h1>

    <img src="tulla.jpg" alt="Segunda pista">

    <p class="clue">📍 Shibuya</p>

    <form onsubmit="checkAnswer(event)">
      <input
        id="answer"
        type="text"
        placeholder="DIGITE A SENHA"
        autocomplete="off"
        required
      >

      <button type="submit">DESBLOQUEAR</button>
    </form>

    <div class="error" id="error"></div>

  `;
}

</script>

</body>
</html>
